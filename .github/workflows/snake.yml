name: Generate Snake
# Controls when the action will run.
on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: "0 0 * * *"

  # Re-generates immediately when the snake workflow configuration changes
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout
        uses: actions/checkout@v3
      # Generates the snake
      - name: Generate Snake
        uses: Platane/snk@v3
        with:
          github_user_name: Hadi-Akram-Ramadhan
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#DC2626&color_dots=#f6ecec,#fca5a5,#ef4444,#b91c1c,#7f1d1d
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#f87171&color_dots=#161b22,#450a0a,#7f1d1d,#b91c1c,#dc2626
      # Pushes the generated files to the output branch
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
