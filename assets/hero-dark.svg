<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="hadi-hero-title-dark hadi-hero-desc-dark">
  <title id="hadi-hero-title-dark">Hadi Akram Ramadhan (Hadooyy): Full-Stack Engineer and AI Integration</title>
  <desc id="hadi-hero-desc-dark">Personal GitHub profile header in obsidian and crimson theme</desc>
  <defs>
    <linearGradient id="bg-crimson-dark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#08080A"/>
      <stop offset="55%" stop-color="#150406"/>
      <stop offset="100%" stop-color="#2D070C"/>
    </linearGradient>
    <linearGradient id="card-crimson-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0508"/>
      <stop offset="100%" stop-color="#0A0607"/>
    </linearGradient>
    <linearGradient id="rule-crimson-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#EF4444" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Chamfered Outer Chassis -->
  <polygon points="24,0 1200,0 1200,296 1176,320 0,320 0,24" fill="url(#bg-crimson-dark)"/>
  <polygon points="24,1 1199,1 1199,295.5 1175.5,319 1,319 1,24.5" fill="none" stroke="#7F1D1D" stroke-opacity="0.7" stroke-width="1.5"/>

  <!-- Left Crimson Structural Spine -->
  <polygon points="0,24 6,18 6,302 0,308" fill="#DC2626"/>

  <!-- Tactical Corner Registration Marks -->
  <path d="M 1152 24 L 1176 24 L 1176 48" fill="none" stroke="#DC2626" stroke-opacity="0.75" stroke-width="1.5"/>
  <path d="M 24 272 L 24 296 L 48 296" fill="none" stroke="#DC2626" stroke-opacity="0.75" stroke-width="1.5"/>

  <!-- Left Emblem Plate (Chamfered Monogram Panel) -->
  <polygon points="68,60 324,60 342,78 342,260 68,260" fill="url(#card-crimson-dark)" stroke="#7F1D1D" stroke-opacity="0.75" stroke-width="1.2"/>
  <rect x="68" y="60" width="64" height="3" fill="#EF4444"/>

  <!-- Geometric Stencil H // Monogram -->
  <g transform="translate(122, 92)">
    <!-- Left Pillar -->
    <polygon points="0,0 32,0 32,136 0,136" fill="#FAF6EB"/>
    <!-- Right Pillar with top-right chamfer -->
    <polygon points="90,0 112,0 122,10 122,136 90,136" fill="#FAF6EB"/>
    <!-- Crimson Crossbar & Slash Accent -->
    <polygon points="32,54 90,54 90,82 32,82" fill="#DC2626"/>
    <!-- Precision Inner Reticle Dots -->
    <rect x="136" y="0" width="12" height="58" fill="#EF4444"/>
    <rect x="136" y="78" width="12" height="58" fill="#7F1D1D"/>
  </g>

  <!-- Vertical Structural Rule -->
  <line x1="382" y1="64" x2="382" y2="256" stroke="#7F1D1D" stroke-opacity="0.65" stroke-width="1"/>

  <!-- Right Identity Block -->
  <text x="418" y="90" fill="#F87171" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="2.1">HADOOYY  ·  JAKARTA / JEMBER, ID</text>

  <text x="418" y="138" fill="#FAF6EB" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.6">Hadi Akram Ramadhan</text>
  <text x="418" y="174" fill="#FCA5A5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">Full-Stack Engineer &amp; AI Integration</text>

  <text x="418" y="214" fill="#D6C5C5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400">Building resilient web backends, local LLM pipelines, and field systems.</text>

  <!-- Crimson Rule & Bottom Coordinates -->
  <rect x="418" y="238" width="718" height="1.5" fill="url(#rule-crimson-dark)"/>
  <text x="418" y="266" fill="#B89B9B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" letter-spacing="0.6">GO  ·  LARAVEL  ·  DJANGO  ·  NEXT.JS  ·  VUE</text>
  <text x="1136" y="266" text-anchor="end" fill="#B89B9B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" letter-spacing="0.6">POLIJE  ·  HEXANEST.ID  ·  O2G</text>
</svg>
